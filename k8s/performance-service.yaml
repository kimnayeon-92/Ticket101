apiVersion: v1
kind: Service
metadata:
  name: performance-service
  namespace: default
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"       # ALB를 생성
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"  # 내부 전용 ALB 설정
  labels:
    app: performance
    environment: production
spec:
  type: ClusterIP
  selector:
    app: performance
  ports:
  - name: http
    protocol: TCP
    port: 80           # ALB에서 접근하는 포트
    targetPort: 3000   # 컨테이너 내부 포트
  externalTrafficPolicy: Local
