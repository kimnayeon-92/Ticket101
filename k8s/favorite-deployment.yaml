apiVersion: apps/v1
kind: Deployment
metadata:
  name: favorite-deployment
  labels:
    app: favorite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: favorite
  template:
    metadata:
      labels:
        app: favorite
    spec:
      containers:
      - name: favorite
        image: 205930629963.dkr.ecr.ap-northeast-2.amazonaws.com/ticket101-ecr:favorite-latest
        imagePullPolicy: IfNotPresent

        ports:
          - containerPort: 5004



        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /ready
            port: 5004
          initialDelaySeconds: 5
          periodSeconds: 10
