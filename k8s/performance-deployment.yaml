apiVersion: apps/v1
kind: Deployment
metadata:
  name: performance-deployment
  labels:
    app: performance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: performance
  template:
    metadata:
      labels:
        app: performance
    spec:
      containers:
      - name: performance
        image: 205930629963.dkr.ecr.ap-northeast-2.amazonaws.com/ticket101-ecr:performance-latest
        imagePullPolicy: IfNotPresent
        
        ports:
          - containerPort: 5005
        
        envFrom:
          - configMapRef:
              name: performance-config

        
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 5005
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /ready
            port: 5005
          initialDelaySeconds: 5
          periodSeconds: 10
