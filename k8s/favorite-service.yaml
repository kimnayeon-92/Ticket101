apiVersion: v1
kind: Service
metadata:
  name: favorite-service
  namespace: default
  labels:
    app: favorite
    environment: production
spec:
  type: NodePort
  selector:
    app: favorite
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
    nodePort: 30002
  externalTrafficPolicy: Local
