apiVersion: v1
kind: Service
metadata:
  name: survey-service
  namespace: default
  labels:
    app: survey
    environment: production
spec:
  type: NodePort
  selector:
    app: survey
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
    nodePort: 30005
  externalTrafficPolicy: Local
