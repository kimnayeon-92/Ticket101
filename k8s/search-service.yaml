apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: default
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "alb"       # ALB 생성
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"  # 내부 전용 ALB 설정
  labels:
    app: search
    environment: production
spec:
  type: LoadBalancer
  selector:
    app: search
  ports:
  - name: http
    protocol: TCP
    port: 80           # ALB에서 사용할 포트
    targetPort: 3000   # 컨테이너에서 사용하는 포트
  externalTrafficPolicy: Local
