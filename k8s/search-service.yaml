apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: default
  labels:
    app: search
    environment: production
spec:
  type: NodePort
  selector:
    app: search
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
    nodePort: 30004
  externalTrafficPolicy: Local
